<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - SFRC Assist</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="admin-login-body">

    <div class="admin-login-wrapper">
        <div class="admin-login-card">
            <img src="{{ url_for('static', filename='images/SFR-logo.jpg') }}" alt="SFRC Logo" class="admin-logo">

            <h1>Admin Login</h1>
            <p class="admin-subtitle">Sign in to manage SFRC Assist</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form action="{{ url_for('admin_login') }}" method="POST" class="admin-login-form">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>

                <button type="submit">Login</button>
            </form>
        </div>
    </div>

</body>
</html>
